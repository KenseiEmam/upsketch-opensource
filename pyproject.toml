[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sketchlift-pipeline"
version = "0.1.0"
description = "SketchLift image-processing pipeline and local UI"
requires-python = ">=3.11"
dependencies = [
    "opencv-python-headless==5.0.0.93",
    "numpy>=2.2.0",
    "Pillow>=10.4.0",
    "psd-tools==1.23.0",
    "Flask>=3.0.3",
    "Werkzeug>=3.0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pipeline*", "local_ui*"]

[tool.setuptools.package-data]
local_ui = ["templates/*.html", "static/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
